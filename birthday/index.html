<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дело №1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@1,700&family=PT+Mono&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@1,700&family=Rubik:wght@400;500;700;800&family=Russo+One&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <!-- Ornamental corners of the game frame -->
    <svg class="frame-orn" viewBox="0 0 1600 900" aria-hidden="true">
      <defs>
        <g id="corner" fill="none" stroke="#7fb0b8" stroke-width="2.5" stroke-linecap="round">
          <path d="M8 70 C8 30 30 8 70 8"/>
          <path d="M18 70 C18 40 40 18 70 18"/>
          <path d="M8 8 L34 34"/>
          <path d="M70 8 C90 8 96 22 86 30 C78 36 70 28 76 22"/>
          <path d="M8 70 C8 90 22 96 30 86 C36 78 28 70 22 76"/>
          <circle cx="38" cy="38" r="5" fill="#7fb0b8"/>
        </g>
      </defs>
      <use href="#corner"/>
      <use href="#corner" transform="translate(1600 0) scale(-1 1)"/>
      <use href="#corner" transform="translate(0 900) scale(1 -1)"/>
      <use href="#corner" transform="translate(1600 900) scale(-1 -1)"/>
    </svg>

    <div id="viewport">
      <div id="scene"></div>
      <div id="modal" class="hidden"></div>
      <div id="overlay-root"></div>
    </div>

    <button id="menu-btn" class="rail-btn rail-left"></button>
    <button id="help-btn" class="rail-btn rail-right">?</button>

    <div id="textbox"><div id="text"></div></div>
    <div id="inventory"></div>

    <div id="full-root"></div>
  </div>

  <script src="content.js"></script>
  <script src="georgia.js"></script>
  <script src="game.js"></script>
</body>
</html>
